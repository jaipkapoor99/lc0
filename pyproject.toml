[build-system]
requires = ["pybind11>=2.11", "scikit-build-core>=0.10"]
build-backend = "scikit_build_core.build"

[project]
name = "lczero_bindings"
version = "0.1.0"
description = "Leela Chess Zero Python bindings"
authors = [{ name = "The LCZero Authors" }]
license = {file = "COPYING"}
readme = "README.md"
requires-python = ">=3.7"
dependencies = ["python-chess>=1.999"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Topic :: Games/Entertainment :: Board Games",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Environment :: GPU"
]

[project.urls]
homepage = "https://github.com/LeelaChessZero/lc0"

[dependency-groups]
dev = ["ruff>=0.9"]

[tool.ruff]
target-version = "py37"
line-length = 88
extend-exclude = ["build", "builddir", "subprojects", "third_party"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.scikit-build]
cmake.version = ">=3.28"
cmake.args = ["-DENABLE_CUDA=OFF", "-DENABLE_TESTS=OFF", "-DENABLE_PYTHON_BINDINGS=ON"]
wheel.install-dir = "lczero"